# 实验上游不发送 X-Accel-Buffering，避免覆盖代理缓冲配置。
server {
    listen 80;
    server_name localhost;
    access_log off;
    location / {
        proxy_pass http://fixture:3000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 2s;
        proxy_connect_timeout 2s;
    }
}
