[project]
name = "ops-python-bridge"
version = "0.1.0"
requires-python = ">=3.12,<3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
filterwarnings = ["error"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["ops_bridge"]

[[tool.mypy.overrides]]
# pymilvus 2.5与grpcio没有py.typed；只对它们放宽缺失存根，调用结果在边界处再校验。
module = ["pymilvus", "pymilvus.*", "grpc", "grpc.*"]
ignore_missing_imports = true
